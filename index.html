<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ブラウザでPython</title>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<style>
:root{
  --paper:#eef2ea; --panel:#fbfcf8; --ink:#1c2a22; --muted:#5d6b62;
  --line:#c9d3c4; --accent:#2b5fd9; --accent-ink:#fff; --err:#b3261e;
  --out-bg:#18221c; --out-ink:#dfeadf;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#121a15; --panel:#1a241e; --ink:#e3ece4; --muted:#93a398;
    --line:#2d3a32; --accent:#7ba2ff; --accent-ink:#0d1a3a; --err:#ff8a80;
    --out-bg:#0c120e; --out-ink:#dfeadf;}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);
  font:16px/1.6 "Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif;
  display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 20px;
  border-bottom:1px solid var(--line);background:var(--panel)}
h1{font-size:1.1rem;margin:0 auto 0 0;font-weight:700}
#status{font-size:.85rem;color:var(--muted)}
select,button{font:inherit;font-size:.9rem;padding:7px 14px;border-radius:6px;
  border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
button.run{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button:disabled{opacity:.5;cursor:wait}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px 20px;min-height:0}
@media (max-width:760px){main{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}
.pane{display:flex;flex-direction:column;min-height:0}
.pane label{font-size:.85rem;color:var(--muted);margin-bottom:6px}
textarea,pre{flex:1;margin:0;padding:14px;border-radius:8px;border:1px solid var(--line);
  font:14px/1.6 ui-monospace,"SF Mono",Menlo,Consolas,monospace;overflow:auto;min-height:0}
textarea{background:var(--panel);color:var(--ink);resize:none;tab-size:4}
pre{background:var(--out-bg);color:var(--out-ink);white-space:pre-wrap;word-break:break-word}
pre .err{color:#ff9a90}
</style>
</head>
<body>
<header>
  <h1>ブラウザでPython</h1>
  <span id="status" role="status">Pythonを読み込み中…</span>
  <select id="examples" aria-label="サンプルを選ぶ">
    <option value="">サンプルを選ぶ</option>
    <option value="hello">Hello World</option>
    <option value="loop">ループとFizzBuzz</option>
    <option value="func">関数とクラス</option>
    <option value="numpy">NumPy（初回は読み込みに時間がかかります）</option>
  </select>
  <button id="clear">出力を消す</button>
  <button id="run" class="run" disabled>実行 (Ctrl+Enter)</button>
</header>
<main>
  <section class="pane">
    <label for="code">コード</label>
    <textarea id="code" spellcheck="false" autocomplete="off"></textarea>
  </section>
  <section class="pane">
    <label for="out">出力</label>
    <pre id="out" aria-live="polite"></pre>
  </section>
</main>

<script>
const EXAMPLES = {
hello: `print("Hello, World!")
name = "Python"
print(f"{name} がブラウザで動いています")`,
loop: `for i in range(1, 16):
    if i % 15 == 0:
        print("FizzBuzz")
    elif i % 3 == 0:
        print("Fizz")
    elif i % 5 == 0:
        print("Buzz")
    else:
        print(i)`,
func: `class Counter:
    def __init__(self):
        self.n = 0

    def up(self):
        self.n += 1
        return self.n

c = Counter()
for _ in range(3):
    print(c.up())`,
numpy: `import numpy as np

a = np.arange(12).reshape(3, 4)
print(a)
print("平均:", a.mean())`
};

const $ = id => document.getElementById(id);
const code = $("code"), out = $("out"), runBtn = $("run"), status = $("status");
let pyodide = null;

code.value = EXAMPLES.hello;

function write(text, isErr) {
  const span = document.createElement("span");
  if (isErr) span.className = "err";
  span.textContent = text + "\n";
  out.appendChild(span);
  out.scrollTop = out.scrollHeight;
}

async function init() {
  try {
    pyodide = await loadPyodide();
    pyodide.setStdout({ batched: s => write(s) });
    pyodide.setStderr({ batched: s => write(s, true) });
    status.textContent = "準備できました";
    runBtn.disabled = false;
  } catch (e) {
    status.textContent = "Pythonの読み込みに失敗しました。ネットワークを確認して再読み込みしてください。";
  }
}

async function run() {
  if (!pyodide || runBtn.disabled) return;
  runBtn.disabled = true;
  status.textContent = "実行中…";
  try {
    await pyodide.loadPackagesFromImports(code.value);
    await pyodide.runPythonAsync(code.value);
  } catch (e) {
    write(String(e.message || e), true);
  }
  status.textContent = "準備できました";
  runBtn.disabled = false;
}

runBtn.addEventListener("click", run);
$("clear").addEventListener("click", () => { out.textContent = ""; });
$("examples").addEventListener("change", e => {
  if (EXAMPLES[e.target.value]) code.value = EXAMPLES[e.target.value];
  e.target.value = "";
});
code.addEventListener("keydown", e => {
  if (e.key === "Tab") {
    e.preventDefault();
    const s = code.selectionStart;
    code.setRangeText("    ", s, code.selectionEnd, "end");
  } else if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    run();
  }
});

init();
</script>
</body>
</html>
